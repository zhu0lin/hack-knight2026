<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; media-src 'self' blob: mediastream:;" />
  <title>Vital Verdict</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="vitals-panel">
      <div class="brand">VITAL <span>VERDICT</span></div>
      <div class="cam-wrap">
        <video id="cam" autoplay muted playsinline></video>
        <div id="coach" class="coach hidden"></div>
        <div id="sim-badge" class="sim-badge hidden">SIMULATED VITALS</div>
      </div>
      <div class="my-vitals">
        <div class="bpm-row">
          <span class="heart" id="my-heart">&#9829;</span>
          <span id="my-bpm" class="bpm">--</span><span class="unit">BPM</span>
        </div>
        <div class="vitals-meta">
          <div>Confidence <b id="my-conf">--</b></div>
          <div>Resting <b id="my-baseline">--</b></div>
        </div>
        <div class="calib">
          <div class="calib-label" id="calib-label">Calibrating resting pulse...</div>
          <div class="bar"><div id="calib-bar" class="bar-fill"></div></div>
        </div>
        <button id="recalibrate" class="btn small ghost">Recalibrate</button>
        <div id="vitals-error" class="error hidden"></div>
        <div id="sim-help" class="sim-help hidden">Hold <kbd>H</kbd> to simulate a stress spike.</div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="toasts"></div>
  <script src="../../dist/renderer.js"></script>
</body>
</html>
